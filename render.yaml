# Render web service (Free plan compatible, no persistent disk).
services:
  - type: web
    name: instagram-reel-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: INSTAGRAM_SESSION
        sync: false
      - key: DESTINATION_USERNAME
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: UPLOAD_SECRET
        generateValue: true
      - key: REEL_FETCH_COUNT
        value: 30
      - key: COVER_MODE
        value: random
      - key: COVER_FILE
        sync: false
      - key: COVER_DIR
        value: cover
      - key: COVER_URL
        sync: false
      - key: ARCHIVE_MIN_AGE_HR
        value: 24
      - key: ARCHIVE_MAX_VIEWS
        value: 900
      - key: HIDE_LIKE_VIEW_COUNTS
        value: true
      - key: SHARE_TO_FEED
        value: true
      - key: PROXY_URL
        sync: false
      - key: TELEGRAM_ENABLED
        value: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
